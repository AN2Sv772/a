name: smtp-verify
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smtp:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test port 25
        run: |
          python3 - <<'EOF'
          import socket, sys
          hosts = ['alt1.gmail-smtp-in.l.google.com', 'mx1.hotmail.com',
                   'mta5.am0.yahoodns.net', 'aspmx.l.google.com']
          ok = 0
          for h in hosts:
              try:
                  s = socket.create_connection((h, 25), timeout=8)
                  s.close(); ok += 1
                  print(h, 'REACHABLE')
              except Exception as e:
                  print(h, 'FAIL', repr(e))
          if ok == 0:
              print('NO SMTP EGRESS, aborting')
              sys.exit(1)
          EOF

      - name: Verify emails (checkpointed)
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          python3 smtp_verify.py emails.txt --out smtp_verified.csv --workers 400 &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            sleep 240
            git add -f smtp_verified.csv errors.log 2>/dev/null || true
            git commit -q -m "checkpoint $(date -u +%H:%M)" 2>/dev/null || true
            git push -f -q https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/AN2Sv772/a.git HEAD:results 2>/dev/null || true
          done
          wait $PID || true
          echo "verifier exited"

      - name: Final push results
        if: always()
        run: |
          git add -f smtp_verified.csv errors.log 2>/dev/null || true
          git commit -q -m "final $(date -u +%FT%TZ)" 2>/dev/null || true
          git push -f -q https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/AN2Sv772/a.git HEAD:results 2>/dev/null || true

      - name: Summarize
        if: always()
        run: |
          python3 - <<'EOF'
          from collections import Counter
          c = Counter()
          try:
              for line in open('smtp_verified.csv'):
                  if line.startswith('email,'): continue
                  p = line.strip().split(',')
                  if len(p) >= 2: c[p[1]] += 1
          except FileNotFoundError:
              pass
          print('FINAL', dict(c), 'total', sum(c.values()))
          EOF